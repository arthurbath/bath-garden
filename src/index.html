<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<title>Art Bath | Bath Garden</title>
		<link rel="icon" href="favicon.png">
		<link rel="preload" href="images/up.png" as="image">
		<link rel="preload" href="images/right.png" as="image">
		<link rel="preload" href="images/down.png" as="image">
		<link rel="preload" href="images/left.png" as="image">
		<link rel="preload" href="images/ahh.png" as="image">
		<link rel="preload" href="images/static.gif" as="image">
		<link rel="preload" href="images/maybe.gif" as="image">
		<link rel="preload" href="images/eye.gif" as="image">
		<style>
			html {
				background-color: #fff;
			}

			html:not(.is-ready) body {
				visibility: hidden;
			}
		</style>
		<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
		<meta name="description" content="Bath Garden is the personal homepage of Art Bath.">
		<meta name="author" content="Art Bath">
		<script defer data-domain="bath.garden" src="https://plausible.bath.black/js/script.outbound-links.pageview-props.tagged-events.js"></script>
		<script>window.plausible = window.plausible || function() { (window.plausible.q = window.plausible.q || []).push(arguments) }</script>
	</head>
	<body>
		<script type="module" src="./main.ts"></script>

		<noscript>
			<style>
				html:not(.is-ready) body {
					visibility: visible;
				}

				body > :not(noscript) {
					display: none !important;
				}

				.no-script-message {
					display: flex;
					font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
				}
			</style>
			<p class="no-script-message" role="alert" aria-live="assertive">
				Bath Garden needs JavaScript enabled to animate.
			</p>
		</noscript>

		<header class="site-intro" aria-label="Art Bath links">
			<p class="site-intro__kicker">Bath Garden</p>
			<h1 class="site-intro__title">Art Bath</h1>
			<nav class="site-links" aria-label="Places">
				<a class="site-links__link" href="https://os.bath.garden/">BathOS</a>
				<a class="site-links__link" href="https://www.youtube.com/@artbath">YouTube</a>
			</nav>
		</header>

		<div class="landscape">
			<div class="landscape__sky"></div>
			<div class="landscape__earth"></div>
		</div>

		<div class="tv">
			<div class="tv__screen" data-channel="static"></div>
			<img class="tv__set" src="images/tv.svg" alt="The source of all knowledge">
		</div>

		<img class="art-body" src="images/body.png" alt="The whip">

		<div class="art-head" data-face="center"></div>

		<div class="rubble">
			<div class="rubble__bit"></div>

			<div class="rubble__bit"></div>
			<div class="rubble__bit"></div>

			<div class="rubble__bit"></div>
			<div class="rubble__bit"></div>
			<div class="rubble__bit"></div>

			<div class="rubble__bit"></div>
			<div class="rubble__bit"></div>
			<div class="rubble__bit"></div>
			<div class="rubble__bit"></div>

			<div class="rubble__bit"></div>
			<div class="rubble__bit"></div>
			<div class="rubble__bit"></div>
			<div class="rubble__bit"></div>
			<div class="rubble__bit"></div>
		</div>

		<img class="dog" src="images/dog.png" alt="A small dog with a small brain">
	</body>
</html>
