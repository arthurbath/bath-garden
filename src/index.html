<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<title>Art Bath</title>
		<link rel="icon" href="favicon.png">
		<link rel="preload" href="images/up.png" as="image">
		<link rel="preload" href="images/right.png" as="image">
		<link rel="preload" href="images/down.png" as="image">
		<link rel="preload" href="images/left.png" as="image">
		<link rel="preload" href="images/ahh.png" as="image">
		<link rel="preload" href="images/static.gif" as="image">
		<link rel="preload" href="images/maybe.gif" as="image">
		<link rel="preload" href="images/eye.gif" as="image">
		<style>
			html {
				background-color: #fff;
			}

			html:not(.is-ready) body {
				visibility: hidden;
			}
		</style>
		<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
		<meta name="description" content="The personal homepage of Art Bath.">
		<meta name="author" content="Art Bath">
	</head>
	<body>
		<script type="module" src="./main.ts"></script>

		<noscript>
			<style>
				html:not(.is-ready) body {
					visibility: visible;
				}

				body > :not(noscript) {
					display: none !important;
				}

				.no-script-message {
					display: flex;
					font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
				}
			</style>
			<p class="no-script-message" role="alert" aria-live="assertive">
				Art Bath needs JavaScript enabled to animate.
			</p>
		</noscript>

		<header class="site-intro" aria-label="Art Bath links">
			<h1 class="site-intro__title">Art Bath</h1>
			<nav class="site-links" aria-label="Places">
				<a class="site-links__link" href="https://os.bath.garden/">
					<svg class="site-links__icon lucide lucide-monitor" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
						<rect width="20" height="14" x="2" y="3" rx="2"></rect>
						<line x1="8" x2="16" y1="21" y2="21"></line>
						<line x1="12" x2="12" y1="17" y2="21"></line>
					</svg>
					<span>BathOS</span>
				</a>
				<a class="site-links__link" href="https://www.youtube.com/@artbath">
					<svg class="site-links__icon lucide lucide-youtube" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
						<path d="M2.5 17a24.1 24.1 0 0 1 0-10 2 2 0 0 1 1.4-1.4 49.6 49.6 0 0 1 16.2 0A2 2 0 0 1 21.5 7a24.1 24.1 0 0 1 0 10 2 2 0 0 1-1.4 1.4 49.6 49.6 0 0 1-16.2 0A2 2 0 0 1 2.5 17"></path>
						<path d="m10 15 5-3-5-3z"></path>
					</svg>
					<span>YouTube</span>
				</a>
			</nav>
		</header>

		<div class="landscape">
			<div class="landscape__sky"></div>
			<div class="landscape__earth"></div>
		</div>

		<div class="tv">
			<div class="tv__screen" data-channel="static"></div>
			<img class="tv__set" src="images/tv.svg" alt="The source of all knowledge">
		</div>

		<img class="art-body" src="images/body.png" alt="The whip">

		<div class="art-head" data-face="center"></div>

		<div class="rubble">
			<div class="rubble__bit"></div>

			<div class="rubble__bit"></div>
			<div class="rubble__bit"></div>

			<div class="rubble__bit"></div>
			<div class="rubble__bit"></div>
			<div class="rubble__bit"></div>

			<div class="rubble__bit"></div>
			<div class="rubble__bit"></div>
			<div class="rubble__bit"></div>
			<div class="rubble__bit"></div>

			<div class="rubble__bit"></div>
			<div class="rubble__bit"></div>
			<div class="rubble__bit"></div>
			<div class="rubble__bit"></div>
			<div class="rubble__bit"></div>
		</div>

		<img class="dog" src="images/dog.png" alt="A small dog with a small brain">
	</body>
</html>
